name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR は新しい push で古い実行を捨てる。main は捨てない——ここで打ち切ると、
# 走っている deploy ごと殺してしまい、後続の実行が落ちれば本番は古いままになる。
#
# グループにイベント種別を入れているのは、待機中の実行が別種のイベントに
# 置き換えられるのを防ぐため。GitHub は cancel-in-progress: false でも、
# 同じグループに後から入った実行で待機中のものを差し替える。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# トークンは読むだけでよい。書き込みは Cloudflare 側（シークレットの API トークン）で、
# GitHub への書き込みはどのジョブもしない。既定のままだと書き込み権限まで付く。
permissions:
  contents: read

jobs:
  check:
    name: Lint / Format / Types / Unit
    runs-on: ubuntu-latest
    # 既定は 360 分。固まると、その分だけランナーを占有する。いつもは 1 分弱。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # server.ts はビルド済み HTML を import するので、型チェックの前に生成しておく
      - name: Build UI
        run: npm run build:ui

      - name: oxlint
        run: npm run lint

      - name: oxfmt (差分が出たら失敗)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: knip (未使用コード・依存の検出)
        run: npm run knip

      - name: Unit tests
        run: npm test

      - name: Worker をバンドルできるか確認
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dist

  e2e-shard:
    # 「E2E (Playwright)」は必須チェックの名前なので、下の取りまとめジョブに残す。
    name: E2E (Playwright) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # いつもは 1 分半前後。retries が 2 回ずつ重なっても収まる長さにしてある。
    timeout-minutes: 15
    strategy:
      # 片方が落ちても、もう片方は最後まで流す。どのテストが落ちたかを一度で見たい。
      fail-fast: false
      matrix:
        # **3 つのジョブに分ける。** 4 worker でも、CI では 111 件に 163 秒かかり
        # 2 分を切れなかった（手元の約半分の速さで、1 本あたりの開く手間が均等に効く）。
        # ジョブごとに CPU が別なので、件数がそのまま分かれる。
        #
        # 2 つでは、サインイン済み（1 つの worker で順に流す 10 本）が入る方が
        # 89〜109 秒で、上限まで余裕が無かった。3 つにすると 37 件ずつになる。
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 検証ホスト（MCP Apps SDK の basic-host）を取得・ビルドする
      - name: Read E2E host version
        id: e2e-host-version
        run: echo "version=$(node scripts/setup-e2e.mjs --version)" >> "$GITHUB_OUTPUT"

      - name: Cache E2E host
        id: cache-e2e-host
        uses: actions/cache@v5
        with:
          path: e2e-host
          key: e2e-host-${{ steps.e2e-host-version.outputs.version }}-${{ hashFiles('scripts/setup-e2e.mjs', 'package-lock.json', '.nvmrc') }}

      - name: Set up E2E host
        run: npm run e2e:setup

      # ブラウザ本体はキャッシュしない。試したが、当たっても OS の依存（apt）を
      # 入れる時間が残り、平均 20.7 秒（15 回）と、毎回入れる 22〜24 秒から 2 秒ほど
      # しか縮まなかった。ステップを 3 つ増やすほどの差ではない。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        id: e2e-tests
        run: npx playwright test --shard=${{ matrix.shard }}/3

      # 再試行で成功した初回失敗も保存する。HTMLと全試行のtrace/画像/JSONを一緒に残す。
      - uses: actions/upload-artifact@v5
        if: always() && (steps.e2e-tests.outcome == 'success' || steps.e2e-tests.outcome == 'failure')
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  e2e:
    # 必須チェックはこの名前で登録してある。分けたジョブの名前は「1/3」などが付くので、
    # ここで 1 つにまとめて名乗る。
    name: E2E (Playwright)
    needs: e2e-shard
    # **必ず走らせる。** 分けたジョブが落ちるとここはスキップになり、GitHub は
    # スキップした必須チェックを「通った」と扱う。走らせて、結果を自分で見る。
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 分けた E2E がすべて通ったか
        run: test "$RESULT" = "success"
        env:
          RESULT: ${{ needs.e2e-shard.result }}

  deploy:
    name: Deploy (production)
    # テストを通っていないものを本番に出さない。PR では走らせない。
    # main での手動実行も通す。rollback したあとに出し直すなど、
    # 新しいコミットを作らずに本番を揃えたい場面があるため。
    needs: [check, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 連続でマージしたときに、古い方が後から上書きしないようにする。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Workers にはファイルシステムが無いので、HTML を埋め込んでからデプロイする
      - name: Build UI
        run: npm run build:ui

      - name: wrangler deploy
        id: deploy
        run: |
          # 手動実行は古いリビジョンのまま走っていることがある。その間に新しい
          # push が出ていたら、ここで出すと本番を巻き戻してしまう。直前に
          # main の先頭と突き合わせて、違っていれば出さずに終える。
          #
          # push のときは見ない。main の push は concurrency で直列化されて
          # いるので追い越しが起きず、逆にここで飛ばすと「次の push が落ちたら
          # どちらも出ない」という穴になる。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            head=$(git rev-parse HEAD)
            remote=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$remote" ]; then
              echo "::notice::main の先頭は $remote。このリビジョン $head は出さない"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # **表を先に作ってからコードを出す。** wrangler deploy は
          # migrations/ を見ないので、ここで適用しないと、新しいコードが
          # まだ無い表を触って会員機能だけが落ちる。
          # 移行は足すだけ・冪等（CREATE TABLE IF NOT EXISTS）なので、
          # 同じものが二度流れても壊れない。
          npm run db:migrate
          npx wrangler deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 本番が応答するか確認
        if: steps.deploy.outputs.skipped != 'true'
        run: |
          for i in $(seq 1 10); do
            # 接続や DNS で転んだときも curl は非ゼロで終わる。set -e で
            # 1 回目に打ち切られないよう、失敗は 000 として扱って次を試す。
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://iekeiramen.com/health || true)
            [ "$code" = "200" ] && echo "health: 200" && exit 0
            echo "まだ 200 ではない（$code）。$i 回目、3 秒後に再試行" >&2
            sleep 3
          done
          echo "デプロイ後に /health が 200 を返さない（最後は $code）" >&2
          exit 1
