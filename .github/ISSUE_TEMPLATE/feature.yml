# 種類ラベルはここで付く。領域ラベル（area:*）は付かないので、作るときに足す
# （.github/LABELS.md と /create-issue を参照）。
name: 機能・改善
description: 新しい機能や、いまある機能の改善（enhancement）
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: なぜ要るか。困っている場面と、実測や実例があれば数字で書く
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: やること
      description: 何を作るか・変えるか
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 守ること
      description: 壊してはいけないもの・決めごと（無料枠、匿名の検索は止めない、など）
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: チェックボックスで書く。確かめ方まで書く
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: 親
      description: 親 issue があれば番号を書く
      placeholder: "#50"
