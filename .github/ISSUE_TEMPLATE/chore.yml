# 種類ラベルはここで付く。領域ラベル（area:*）は付かないので、作るときに足す
# （.github/LABELS.md と /create-issue を参照）。
name: 作業
description: 挙動を変えない作業。依存更新・整理・移行・開発の足場（chore）
labels: ["chore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: なぜ今やるか。実測があれば数字で書く
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: やること
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: チェックボックスで書く。**挙動が変わらないことの確かめ方**を必ず入れる
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: 親
      description: 親 issue があれば番号を書く
      placeholder: "#50"
