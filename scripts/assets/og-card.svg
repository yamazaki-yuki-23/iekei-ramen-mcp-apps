<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>近くに、まだ知らない家系がある。</title>
  <desc>家系ラーメンを地図で探し、迷ったら3軒に絞る。iekeiramen.com</desc>
  <!--
    最初の画面（PromiseHero）と同じ色の役割: 暖かい灰の面、黒の文字、強める 1 語だけ茶赤（#130）。
    ロゴはラーメン丼。件数・味・店名は断定しないので載せない。色は global.css のプリミティブと同じ値。
  -->
  <rect width="1200" height="630" fill="#f8f7f5" />
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#dedbd6" stroke-width="2" />
  <g transform="translate(80 66) scale(1.15)">
    <g stroke="#22150e" stroke-width="4" stroke-linecap="round">
      <line x1="47" y1="5" x2="30" y2="29" />
      <line x1="55" y1="9" x2="36" y2="29" />
    </g>
    <rect x="13" y="12" width="11" height="19" rx="1.5" fill="#22150e" />
    <rect x="4" y="27" width="56" height="7" rx="3.5" fill="#22150e" />
    <path d="M7 33H57C57 48 46 57 32 57C18 57 7 48 7 33Z" fill="#b8442c" />
    <rect x="21" y="56" width="22" height="5" rx="2" fill="#b8442c" />
  </g>
  <g font-family="'Hiragino Sans', 'Noto Sans CJK JP', system-ui, sans-serif">
    <text x="164" y="130" fill="#22150e" font-size="34" font-weight="700">家系ラーメンを探す</text>
    <text x="80" y="290" fill="#22150e" font-size="92" font-weight="900">近くに、<tspan fill="#9a3623">まだ知らない</tspan></text>
    <text x="80" y="410" fill="#22150e" font-size="92" font-weight="900">家系がある。</text>
    <text x="80" y="520" fill="#635e57" font-size="34" font-weight="700">地図で探して、迷ったら3軒に絞る。</text>
    <text x="1120" y="570" fill="#635e57" font-size="28" font-weight="500" text-anchor="end">iekeiramen.com</text>
  </g>
</svg>
