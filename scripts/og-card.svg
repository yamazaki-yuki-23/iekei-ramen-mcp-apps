<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>近くに、まだ知らない家系がある。</title>
  <desc>家系ラーメンを地図で探し、迷ったら3軒に絞る。iekeiramen.com</desc>
  <!--
    最初の画面（PromiseHero）と同じ舞台: 醤油の黒の地に、約束の一言を屋号の太さで（#130）。
    件数・味・店名は断定しないので載せない。色は global.css のプリミティブと同じ値。
  -->
  <rect width="1200" height="630" fill="#22150e" />
  <rect width="1200" height="14" fill="#ffc81a" />
  <!-- 海苔 3 枚（＝迷ったら 3 軒） -->
  <g fill="#ffc81a">
    <rect x="1000" y="96" width="34" height="132" rx="5" />
    <rect x="1050" y="80" width="34" height="164" rx="5" />
    <rect x="1100" y="96" width="34" height="132" rx="5" />
  </g>
  <g font-family="'Hiragino Sans', 'Noto Sans CJK JP', system-ui, sans-serif" font-weight="900">
    <text x="80" y="230" fill="#fff8e8" font-size="92">近くに、</text>
    <text x="80" y="350" fill="#ffd84d" font-size="92">まだ知らない</text>
    <text x="80" y="470" fill="#fff8e8" font-size="92">家系がある。</text>
  </g>
  <g transform="translate(80 518) scale(1.25)">
    <path d="M24 46C24 46 6 30 6 19a18 18 0 0 1 36 0c0 11-18 27-18 27z" fill="#b8442c" stroke="#fff8e8" stroke-width="2.5" />
    <circle cx="24" cy="19" r="11" fill="#ffd84d" stroke="#150c07" stroke-width="2" />
    <g fill="#150c07">
      <rect x="13.5" y="6" width="5" height="12" rx="1" transform="rotate(-12 16 12)" />
      <rect x="19.5" y="4.5" width="5" height="12" rx="1" />
      <rect x="25.5" y="6" width="5" height="12" rx="1" transform="rotate(12 28 12)" />
    </g>
  </g>
  <g font-family="'Hiragino Sans', 'Noto Sans CJK JP', system-ui, sans-serif">
    <text x="160" y="562" fill="#e9dccb" font-size="32" font-weight="700">地図で探して、迷ったら3軒に絞る。</text>
    <text x="1120" y="562" fill="#e9dccb" font-size="28" font-weight="500" text-anchor="end">iekeiramen.com</text>
  </g>
</svg>
