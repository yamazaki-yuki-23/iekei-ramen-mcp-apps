<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>今日の家系、迷ったら3軒に絞る。</title>
  <desc>家系ラーメンを探す画面のイメージ。3軒の候補と、別の候補を見るボタン。iekeiramen.com</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#33150f" flood-opacity="0.09" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f8f7f5" />
  <rect width="1200" height="12" fill="#b8442c" />
  <circle cx="1200" cy="630" r="340" fill="#fae4dc" />
  <g font-family="system-ui, -apple-system, 'Noto Sans CJK JP', sans-serif">
    <rect x="64" y="72" width="64" height="64" rx="20" fill="#fae4dc" />
    <text x="96" y="116" text-anchor="middle" font-size="36">🍜</text>
    <text x="64" y="250" fill="#201e1b" font-size="58" font-weight="700">今日の家系、</text>
    <text x="64" y="340" fill="#201e1b" font-size="58" font-weight="700">迷ったら<tspan fill="#9a3623">3軒</tspan>に絞る。</text>
    <rect x="64" y="392" width="80" height="6" rx="3" fill="#b8442c" />
    <text x="64" y="500" fill="#635e57" font-size="30" font-weight="500">iekeiramen.com</text>

    <!-- 店舗名・味・判定を広告上で断定せず、画面の構造だけを示す。 -->
    <g filter="url(#shadow)">
      <rect x="712" y="64" width="424" height="502" rx="24" fill="#ffffff" stroke="#dedbd6" stroke-width="2" />
    </g>
    <text x="744" y="126" fill="#201e1b" font-size="28" font-weight="700">迷ったら</text>
    <rect x="736" y="156" width="376" height="52" rx="14" fill="#f8f7f5" stroke="#dedbd6" />
    <rect x="742" y="162" width="132" height="40" rx="10" fill="#ffffff" />
    <rect x="756" y="200" width="104" height="3" rx="1.5" fill="#b8442c" />
    <text x="808" y="189" text-anchor="middle" fill="#9a3623" font-size="20" font-weight="700">迷ったら</text>
    <text x="926" y="189" text-anchor="middle" fill="#635e57" font-size="20">検索</text>
    <text x="1044" y="189" text-anchor="middle" fill="#635e57" font-size="20">地図</text>

    <g fill="#ffffff" stroke="#dedbd6" stroke-width="2">
      <rect x="736" y="232" width="376" height="66" rx="14" />
      <rect x="736" y="310" width="376" height="66" rx="14" />
      <rect x="736" y="388" width="376" height="66" rx="14" />
    </g>
    <g fill="#b8442c" font-size="28" font-weight="700">
      <text x="756" y="276">1</text>
      <text x="756" y="354">2</text>
      <text x="756" y="432">3</text>
    </g>
    <g fill="#33302c" font-size="22" font-weight="600">
      <text x="806" y="274">候補の1軒目</text>
      <text x="806" y="352">候補の2軒目</text>
      <text x="806" y="430">候補の3軒目</text>
    </g>
    <g fill="#c4c0b9" font-size="24">
      <text x="1070" y="274">›</text>
      <text x="1070" y="352">›</text>
      <text x="1070" y="430">›</text>
    </g>
    <rect x="736" y="478" width="240" height="52" rx="14" fill="#ffffff" stroke="#c4c0b9" stroke-width="2" />
    <text x="856" y="512" text-anchor="middle" fill="#33302c" font-size="22">別の候補を見る</text>
  </g>
</svg>
