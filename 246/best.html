<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; }
  #map { position: absolute; inset: 0; }
  .route { width: 26px; height: 26px; border-radius: 50%; background: #b8442c; color: #fff; font: 700 14px "Hiragino Sans"; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; font-variant-numeric: tabular-nums; }
  .cluster { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #22150e; font: 700 14px "Hiragino Sans"; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #b8442c, 0 1px 3px rgba(34,21,14,.25); }
  .tag { position: absolute; left: 8px; top: 8px; z-index: 5; background: #22150e; color: #fff; font: 700 14px "Hiragino Sans"; padding: 4px 10px; border-radius: 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="tag" id="tag"></div>
<script>
/*
 * 見本を撮るための使い捨ての HTML（#246、作り直し）。アプリのコードではない。
 * 地図のデータは OpenFreeMap（OpenMapTiles の形）。本番は Protomaps なので、層の名前は違う。
 */
const q = new URLSearchParams(location.search);
// 地図の背景だけに使う色（DESIGN.md に --map-* として足す提案）。UI の部品には使わない。
const M = {
  land: "#f7f2e8",      // 生成り。灰ではなく、少し黄みのある暖かい白
  building: "#efe9de",  // 地より一段だけ濃い。輪郭線なし
  green: "#d3e8bd",     // 公園・草地
  wood: "#e1edcf",      // 林・山（日本全体で山並みが分かる淡さ）
  water: "#b7dcf0",     // 海・川・池。誰が見ても水と分かる淡い水色
  waterText: "#4f86a8",
  road: "#ffffff",
  roadCase: "#e6dccb",
  major: "#ffffff",
  majorCase: "#dccbb2",
  motor: "#f3c5b6",     // --ramen-200。他の地図の黄の代わりに、家系の茶赤の淡い段
  motorCase: "#e89d87", // --ramen-300
  rail: "#635e57",      // --gray-600。日本の地図で見慣れた白黒の破線にする
  boundary: "#d8cbb6",
  place: "#635e57",     // --gray-600
  ink: "#22150e",       // --shoyu-900。駅名（券売機のボタンの文字と同じ）
  halo: "#ffffff",
};
const name = ["coalesce", ["get", "name:ja"], ["get", "name"]];
// 「横浜 (相模鉄道)」→「横浜」。路線ごとの駅を同じ名前にして、重なりで 1 つだけ残す。
const stationName = ["let", "n", name, ["case", [">=", ["index-of", " (", ["var", "n"]], 0], ["slice", ["var", "n"], 0, ["index-of", " (", ["var", "n"]]], ["var", "n"]]];
const font = ["Noto Sans Regular"];
const bold = ["Noto Sans Bold"];
const w = (a, b) => ["interpolate", ["exponential", 1.6], ["zoom"], 8, a, 17, b];
const round = { "line-cap": "round", "line-join": "round" };

function style() {
  return {
    version: 8,
    glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
    sources: { omt: { type: "vector", url: "https://tiles.openfreemap.org/planet" } },
    layers: [
      { id: "land", type: "background", paint: { "background-color": M.land } },
      { id: "wood", type: "fill", source: "omt", "source-layer": "landcover", filter: ["==", ["get", "class"], "wood"], paint: { "fill-color": M.wood } },
      { id: "grass", type: "fill", source: "omt", "source-layer": "landcover", minzoom: 10, filter: ["==", ["get", "class"], "grass"], paint: { "fill-color": M.green } },
      { id: "park", type: "fill", source: "omt", "source-layer": "park", paint: { "fill-color": M.green } },
      { id: "water", type: "fill", source: "omt", "source-layer": "water", paint: { "fill-color": M.water } },
      { id: "river", type: "line", source: "omt", "source-layer": "waterway", minzoom: 10, layout: round, paint: { "line-color": M.water, "line-width": w(0.8, 5) } },
      { id: "building", type: "fill", source: "omt", "source-layer": "building", minzoom: 15, paint: { "fill-color": M.building } },
      { id: "boundary", type: "line", source: "omt", "source-layer": "boundary", filter: ["==", ["get", "admin_level"], 4], maxzoom: 11, layout: round, paint: { "line-color": M.boundary, "line-width": 1.2, "line-dasharray": [2, 2] } },
      { id: "road-case", type: "line", source: "omt", "source-layer": "transportation", minzoom: 13, filter: ["in", ["get", "class"], ["literal", ["minor", "tertiary", "service"]]], layout: round, paint: { "line-color": M.roadCase, "line-width": w(1.2, 11) } },
      { id: "road", type: "line", source: "omt", "source-layer": "transportation", minzoom: 13, filter: ["in", ["get", "class"], ["literal", ["minor", "tertiary", "service"]]], layout: round, paint: { "line-color": M.road, "line-width": w(0.6, 9) } },
      { id: "major-case", type: "line", source: "omt", "source-layer": "transportation", minzoom: 9, filter: ["in", ["get", "class"], ["literal", ["primary", "secondary", "trunk"]]], layout: round, paint: { "line-color": M.majorCase, "line-width": w(1.8, 18) } },
      { id: "major", type: "line", source: "omt", "source-layer": "transportation", minzoom: 9, filter: ["in", ["get", "class"], ["literal", ["primary", "secondary", "trunk"]]], layout: round, paint: { "line-color": M.major, "line-width": w(1.1, 15) } },
      { id: "motor-case", type: "line", source: "omt", "source-layer": "transportation", minzoom: 6, filter: ["==", ["get", "class"], "motorway"], layout: round, paint: { "line-color": M.motorCase, "line-width": w(1.6, 19) } },
      { id: "motor", type: "line", source: "omt", "source-layer": "transportation", minzoom: 6, filter: ["==", ["get", "class"], "motorway"], layout: round, paint: { "line-color": M.motor, "line-width": w(0.9, 15) } },
      // 線路: 日本の地図でおなじみの、濃い線に白い破線（JR の記号の形）。
      { id: "rail", type: "line", source: "omt", "source-layer": "transportation", minzoom: 10, filter: ["all", ["==", ["get", "class"], "rail"], ["!", ["has", "service"]]], paint: { "line-color": M.rail, "line-width": w(1, 3) } },
      { id: "rail-dash", type: "line", source: "omt", "source-layer": "transportation", minzoom: 12, filter: ["all", ["==", ["get", "class"], "rail"], ["!", ["has", "service"]]], paint: { "line-color": "#ffffff", "line-width": w(0.5, 1.6), "line-dasharray": [3, 3] } },
      { id: "road-name", type: "symbol", source: "omt", "source-layer": "transportation_name", minzoom: 14, filter: ["in", ["get", "class"], ["literal", ["primary", "secondary", "trunk"]]],
        layout: { "symbol-placement": "line", "text-field": name, "text-font": font, "text-size": 12 }, paint: { "text-color": M.place, "text-halo-color": M.halo, "text-halo-width": 2 } },
      { id: "water-name", type: "symbol", source: "omt", "source-layer": "water_name", minzoom: 9, layout: { "text-field": name, "text-font": font, "text-size": 12, "text-letter-spacing": 0.1 }, paint: { "text-color": M.waterText, "text-halo-color": M.water, "text-halo-width": 1 } },
      { id: "place-pref", type: "symbol", source: "omt", "source-layer": "place", minzoom: 4.5, maxzoom: 7, filter: ["==", ["get", "class"], "state"],
        layout: { "text-field": name, "text-font": bold, "text-size": 12 }, paint: { "text-color": M.place, "text-halo-color": M.halo, "text-halo-width": 2 } },
      { id: "place-city", type: "symbol", source: "omt", "source-layer": "place", minzoom: 7, maxzoom: 11, filter: ["in", ["get", "class"], ["literal", ["city", "town"]]],
        layout: { "text-field": name, "text-font": bold, "text-size": ["interpolate", ["linear"], ["zoom"], 7, 12, 11, 15] }, paint: { "text-color": M.place, "text-halo-color": M.halo, "text-halo-width": 2 } },
      { id: "place-ward", type: "symbol", source: "omt", "source-layer": "place", minzoom: 10, maxzoom: 14, filter: ["==", ["get", "class"], "suburb"],
        layout: { "text-field": name, "text-font": bold, "text-size": 14 }, paint: { "text-color": M.place, "text-halo-color": M.halo, "text-halo-width": 2 } },
      { id: "place-town", type: "symbol", source: "omt", "source-layer": "place", minzoom: 14, filter: ["in", ["get", "class"], ["literal", ["quarter", "neighbourhood"]]],
        layout: { "text-field": name, "text-font": font, "text-size": 12 }, paint: { "text-color": "#8a8278", "text-halo-color": M.halo, "text-halo-width": 2 } },
      // 駅名: 券売機のボタンの形（白い面・醤油色の縁・下にずらした影）。同じ名前は 1 つにまとめる（本番は Protomaps で）。
      { id: "station", type: "symbol", source: "omt", "source-layer": "poi", minzoom: 11.5, filter: ["all", ["==", ["get", "class"], "railway"], ["==", ["get", "subclass"], "station"]],
        layout: { "text-field": stationName, "text-font": bold, "text-size": ["interpolate", ["linear"], ["zoom"], 12, 11.5, 16, 13], "icon-image": "key", "icon-text-fit": "both", "icon-text-fit-padding": [2, 6, 4, 6], "symbol-sort-key": ["get", "rank"], "text-padding": 30 },
        paint: { "text-color": M.ink } },
    ],
  };
}
// 今の地図（OSM の標準タイル）と並べるための比較用。
const osmStyle = { version: 8, sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256 } }, layers: [{ id: "osm", type: "raster", source: "osm" }] };

const VIEWS = { yokohama: [139.6222, 35.4658, 14], tokyo: [139.7671, 35.6812, 14], city: [139.62, 35.46, 11.5], japan: [137.6, 36.6, 4.6] };
const [lon, lat, zoom] = VIEWS[q.get("view")];
const plan = q.get("plan");
document.getElementById("tag").textContent = plan === "now" ? "今（OSM 標準）" : "新しい地図";
const map = new maplibregl.Map({ container: "map", style: plan === "now" ? osmStyle : style(), center: [lon, lat], zoom, attributionControl: false, fadeDuration: 0, localIdeographFontFamily: "'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif", canvasContextAttributes: { preserveDrawingBuffer: true } });

// 券売機のボタンの形の絵（9 分割で伸びる）。白い面・醤油色の縁 1.5px・下に 2px の影。
map.on("styleimagemissing", (e) => {
  if (e.id !== "key") return;
  const r = 2, s = 24 * r, cv = document.createElement("canvas"); cv.width = s; cv.height = s;
  const g = cv.getContext("2d");
  const rr = (x, y, ww, hh, rad) => { g.beginPath(); g.roundRect(x, y, ww, hh, rad); };
  g.fillStyle = M.ink; rr(1 * r, 2.5 * r, 22 * r, 20 * r, 5 * r); g.fill();
  g.fillStyle = "#fff"; rr(1 * r, 1 * r, 22 * r, 20 * r, 5 * r); g.fill();
  g.lineWidth = 1.25 * r; g.strokeStyle = M.ink; rr(1.6 * r, 1.6 * r, 20.8 * r, 18.8 * r, 4.5 * r); g.stroke();
  map.addImage("key", g.getImageData(0, 0, s, s), { pixelRatio: r, stretchX: [[7 * r, 17 * r]], stretchY: [[7 * r, 15 * r]], content: [6 * r, 4 * r, 18 * r, 18 * r] });
});

const TASTE = { rich: "#b8442c", creamy: "#e0a04a", chain: "#4a7fb8", unknown: "#7d776e" };
map.on("load", async () => {
  const data = await (await fetch("shops.json")).json();
  const view = q.get("view");
  const shops = view === "tokyo" ? data.tokyo : view === "japan" ? data.japan : data.yokohama;
  const byCenter = [...shops].sort((a, b) => Math.hypot(a.lon - lon, a.lat - lat) - Math.hypot(b.lon - lon, b.lat - lat));
  if (view === "japan" || view === "city") {
    const cells = new Map();
    for (const s of shops) {
      const p = map.project([s.lon, s.lat]);
      const k = `${Math.floor(p.x / 36)},${Math.floor(p.y / 36)}`;
      (cells.get(k) ?? cells.set(k, []).get(k)).push(s);
    }
    const singles = [];
    for (const g of cells.values()) {
      if (g.length === 1) { singles.push(g[0]); continue; }
      const el = document.createElement("div"); el.className = "cluster"; el.textContent = g.length;
      new maplibregl.Marker({ element: el }).setLngLat([g.reduce((a, s) => a + s.lon, 0) / g.length, g.reduce((a, s) => a + s.lat, 0) / g.length]).addTo(map);
    }
    addPins(singles, null);
  } else {
    addPins(shops, byCenter[0]);
    byCenter.slice(1, 4).forEach((s, i) => { const el = document.createElement("div"); el.className = "route"; el.textContent = i + 1; new maplibregl.Marker({ element: el }).setLngLat([s.lon, s.lat]).addTo(map); });
  }
  map.once("idle", () => (document.body.dataset.ready = "1"));
});
function addPins(shops, selected) {
  map.addSource("shops", { type: "geojson", data: { type: "FeatureCollection", features: shops.map((s) => ({ type: "Feature", properties: { c: TASTE[s.t], sel: s === selected }, geometry: { type: "Point", coordinates: [s.lon, s.lat] } })) } });
  map.addLayer({ id: "pins", type: "circle", source: "shops", paint: {
    "circle-color": ["get", "c"], "circle-radius": ["case", ["get", "sel"], 11, 7],
    "circle-stroke-color": ["case", ["get", "sel"], "#141312", "#ffffff"], "circle-stroke-width": ["case", ["get", "sel"], 3, 2],
  } });
}
</script>
</body>
</html>
